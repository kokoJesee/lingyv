<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent 语音输入</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #17342d; background: #f4f7f5; }
    body { margin: 0; padding: 28px 16px; }
    main { max-width: 820px; margin: auto; }
    h1 { font-size: 1.75rem; margin: 0 0 12px; }
    .card { background: white; border: 1px solid #d8e4dc; border-radius: 16px; padding: 24px; margin-top: 20px; }
    .muted { color: #51665e; line-height: 1.65; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0; }
    button { padding: 10px 18px; font: inherit; cursor: pointer; border: 1px solid #b0c8ba; background: #fff; color: #17342d; border-radius: 9px; }
    button.primary { background: #1c634a; color: white; border-color: #1c634a; }
    button:disabled { opacity: .45; cursor: default; }
    textarea { box-sizing: border-box; width: 100%; min-height: 130px; padding: 12px; font: inherit; line-height: 1.6; border: 1px solid #a8bdb0; border-radius: 9px; resize: vertical; }
    label { display: block; margin: 12px 0; }
    #status { min-height: 24px; line-height: 1.65; overflow-wrap: anywhere; }
    #status.error { color: #9f301c; }
    #history { list-style: none; padding: 0; }
    #history li { padding: 12px; white-space: pre-wrap; overflow-wrap: anywhere; border-radius: 9px; margin: 10px 0; line-height: 1.65; background: #edf5ee; }
    #history li.assistant { background: #f3f2ee; }
    #session { font-size: .8rem; overflow-wrap: anywhere; }
    @media (max-width: 480px) { .card { padding: 16px; } button { flex: 1; } }
  </style>
  <script src="/voice.js" defer></script>
</head>
<body>
<main>
  <h1>把想说的话，先说出来</h1>
  <p class="muted">录音结束后会生成文字。你可以修改，再点击发送给 Agent。每段最长 60 秒。</p>
  <section class="card" aria-label="录音和转写">
    <label><input type="radio" name="mode" value="demo" checked> 模拟流程 · 返回预设文字，供操作演示</label>
    <label><input type="radio" name="mode" value="configured"> 腾讯云真实识别 · 本次录音将上传腾讯云进行转写</label>
    <p id="configuration" class="muted">正在检查语音服务配置…</p>
    <div class="controls">
      <button id="record" class="primary">开始录音</button>
      <button id="stop" disabled>停止并转写</button>
      <button id="cancel" disabled>取消本次录音</button>
    </div>
    <p id="status" role="status" aria-live="polite">准备就绪。</p>
    <label for="text">确认并编辑文字</label>
    <textarea id="text" placeholder="转写结果会出现在这里，也可以直接输入文字。"></textarea>
    <p class="muted">转写结果最多在服务内存中保留 10 分钟（可配置），用于防止重复识别。音频在处理结束后释放。点击发送会调用配置的聊天模型。</p>
    <div class="controls"><button id="send" class="primary" disabled>发送给 Agent</button><button id="new">新会话</button></div>
  </section>
  <section class="card" aria-label="对话记录">
    <h2>对话</h2><p id="session" class="muted">发送第一条文字后创建会话。</p>
    <ul id="history"></ul>
  </section>
</main>
</body>
</html>
